version: '3.8'

services:
  sentiment-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentiment-analysis-app
    ports:
      - "8501:8501"
    volumes:
      # Mount data directory for persistent storage
      - ./data:/app/data
      # Mount config for easy updates
      - ./config.yaml:/app/config.yaml
      # Mount .env file if it exists
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentiment-network

  # Optional: PostgreSQL database for data storage
  postgres:
    image: postgres:15-alpine
    container_name: sentiment-postgres
    environment:
      POSTGRES_DB: feedback_db
      POSTGRES_USER: sentiment_user
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentiment-network
    restart: unless-stopped
    profiles:
      - with-db

  # Optional: MongoDB for NoSQL storage
  mongodb:
    image: mongo:7
    container_name: sentiment-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: change_this_password
      MONGO_INITDB_DATABASE: feedback_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sentiment-network
    restart: unless-stopped
    profiles:
      - with-db

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  sentiment-network:
    driver: bridge

