# Kubernetes Deployment Configuration
# For production Kubernetes deployments

---
apiVersion: v1
kind: Namespace
metadata:
  name: sentiment-analysis

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentiment-config
  namespace: sentiment-analysis
data:
  config.yaml: |
    model:
      name: "distilbert-base-uncased-finetuned-sst-2-english"
      use_gpu: false
      batch_size: 32
    
    priority:
      sentiment_weights:
        negative: 9
        neutral: 5
        positive: 2
      confidence_weight: 0.3
      urgent_keyword_weight: 20
      text_length_weight: 0.1

---
apiVersion: v1
kind: Secret
metadata:
  name: sentiment-secrets
  namespace: sentiment-analysis
type: Opaque
stringData:
  # Replace with your actual credentials
  api-key: "your-api-key-here"
  db-connection: "postgresql://user:password@postgres:5432/feedback_db"
  mongodb-uri: "mongodb://admin:password@mongodb:27017/"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentiment-data-pvc
  namespace: sentiment-analysis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-analysis
  namespace: sentiment-analysis
  labels:
    app: sentiment-analysis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentiment-analysis
  template:
    metadata:
      labels:
        app: sentiment-analysis
    spec:
      containers:
      - name: sentiment-analysis
        image: your-registry/sentiment-analysis:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: sentiment-secrets
              key: api-key
        - name: DB_CONNECTION
          valueFrom:
            secretKeyRef:
              name: sentiment-secrets
              key: db-connection
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: sentiment-data-pvc
      - name: config-volume
        configMap:
          name: sentiment-config

---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-analysis-service
  namespace: sentiment-analysis
  labels:
    app: sentiment-analysis
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8501
    protocol: TCP
    name: http
  selector:
    app: sentiment-analysis

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentiment-analysis-hpa
  namespace: sentiment-analysis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentiment-analysis
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Optional: Ingress for HTTPS with cert-manager
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentiment-analysis-ingress
  namespace: sentiment-analysis
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - sentiment.yourdomain.com
    secretName: sentiment-tls
  rules:
  - host: sentiment.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sentiment-analysis-service
            port:
              number: 80

---
# Optional: PostgreSQL Database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sentiment-analysis
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: feedback_db
        - name: POSTGRES_USER
          value: sentiment_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sentiment-secrets
              key: postgres-password
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sentiment-analysis
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
  clusterIP: None

